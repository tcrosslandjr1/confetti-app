<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Confetti</title>
    <meta name="description" content="Your AI-powered lifestyle concierge" />
    <link rel="icon" type="image/svg+xml" href="/confetti-icon.svg" />
    <style>
      #initial-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        color: #1a1a1a;
        overflow: hidden;
        background:
          radial-gradient(
            1200px 600px at 20% -10%,
            rgba(255, 145, 110, 0.35),
            transparent 60%
          ),
          radial-gradient(
            900px 500px at 110% 110%,
            rgba(255, 196, 90, 0.4),
            transparent 55%
          ),
          linear-gradient(180deg, #fff8f0 0%, #ffeede 100%);
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        animation: loader-fade-in 0.4s ease-out both;
      }
      #initial-loader .confetti-field {
        position: absolute;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
      }
      #initial-loader .confetti-field i {
        position: absolute;
        top: -24px;
        width: 10px;
        height: 14px;
        border-radius: 2px;
        opacity: 0;
        animation: confetti-fall linear infinite;
        will-change: transform, opacity;
      }
      #initial-loader .stage {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
        z-index: 1;
      }
      #initial-loader .badge {
        position: relative;
        width: 96px;
        height: 96px;
        border-radius: 28px;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #ff7a4c 0%, #ff5a3c 60%, #e63d57 100%);
        box-shadow:
          0 18px 40px -12px rgba(230, 61, 87, 0.55),
          inset 0 1px 0 rgba(255, 255, 255, 0.45);
        animation: badge-pop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) both;
      }
      #initial-loader .badge::after {
        content: "";
        position: absolute;
        inset: -6px;
        border-radius: 32px;
        border: 2px dashed rgba(255, 122, 76, 0.45);
        animation: spin 6s linear infinite;
      }
      #initial-loader .emoji {
        font-size: 52px;
        line-height: 1;
        filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.15));
        animation: bounce 1.4s ease-in-out infinite;
      }
      #initial-loader .name {
        font-size: 30px;
        font-weight: 900;
        letter-spacing: -0.02em;
        background: linear-gradient(90deg, #1a1a1a 0%, #e63d57 50%, #1a1a1a 100%);
        background-size: 200% 100%;
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: shimmer 2.4s ease-in-out infinite;
      }
      #initial-loader .tagline {
        font-size: 12.5px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.22em;
        color: rgba(26, 26, 26, 0.55);
      }
      #initial-loader .dots {
        display: inline-flex;
        gap: 6px;
        margin-top: 4px;
      }
      #initial-loader .dots span {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #ff5a3c;
        opacity: 0.35;
        animation: dot-pulse 1.2s ease-in-out infinite;
      }
      #initial-loader .dots span:nth-child(2) {
        animation-delay: 0.15s;
        background: #ff9a3c;
      }
      #initial-loader .dots span:nth-child(3) {
        animation-delay: 0.3s;
        background: #ffc24a;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes bounce {
        0%,
        100% {
          transform: translateY(0) rotate(-4deg);
        }
        50% {
          transform: translateY(-10px) rotate(4deg);
        }
      }
      @keyframes shimmer {
        0%,
        100% {
          background-position: 200% 0;
        }
        50% {
          background-position: 0 0;
        }
      }
      @keyframes dot-pulse {
        0%,
        100% {
          opacity: 0.35;
          transform: translateY(0);
        }
        50% {
          opacity: 1;
          transform: translateY(-4px);
        }
      }
      @keyframes badge-pop {
        0% {
          transform: scale(0.7);
          opacity: 0;
        }
        100% {
          transform: scale(1);
          opacity: 1;
        }
      }
      @keyframes loader-fade-in {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      @keyframes confetti-fall {
        0% {
          transform: translate3d(0, -10vh, 0) rotate(0deg);
          opacity: 0;
        }
        10% {
          opacity: 1;
        }
        100% {
          transform: translate3d(var(--dx, 40px), 110vh, 0) rotate(720deg);
          opacity: 0.9;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #initial-loader *,
        #initial-loader *::after {
          animation: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="initial-loader">
        <div class="confetti-field" aria-hidden="true">
          <i style="left:8%;  --dx:60px;  background:#ff5a3c; animation-duration:4.2s; animation-delay:0s"></i>
          <i style="left:18%; --dx:-40px; background:#ff9a3c; animation-duration:5.1s; animation-delay:0.6s"></i>
          <i style="left:28%; --dx:30px;  background:#ffc24a; animation-duration:3.8s; animation-delay:1.2s"></i>
          <i style="left:40%; --dx:-50px; background:#e63d57; animation-duration:4.6s; animation-delay:0.3s"></i>
          <i style="left:52%; --dx:70px;  background:#ff7a4c; animation-duration:5.3s; animation-delay:1.5s"></i>
          <i style="left:64%; --dx:-30px; background:#ffc24a; animation-duration:4.0s; animation-delay:0.9s"></i>
          <i style="left:76%; --dx:50px;  background:#ff5a3c; animation-duration:4.8s; animation-delay:0.2s"></i>
          <i style="left:88%; --dx:-60px; background:#ff9a3c; animation-duration:5.5s; animation-delay:1.1s"></i>
          <i style="left:95%; --dx:20px;  background:#e63d57; animation-duration:4.4s; animation-delay:1.8s"></i>
        </div>
        <div class="stage">
          <div class="badge"><div class="emoji">🎊</div></div>
          <div class="name">Confetti</div>
          <div class="tagline">Curating your night</div>
          <div class="dots" aria-hidden="true"><span></span><span></span><span></span></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
