<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Confetti</title>
    <meta name="description" content="Your AI-powered lifestyle concierge" />
    <link rel="icon" type="image/svg+xml" href="/confetti-icon.svg" />
    <style>
      #initial-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: #fff8f0;
        color: #1a1a1a;
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
      }
      #initial-loader .emoji {
        font-size: 56px;
        animation: bounce 1.2s ease-in-out infinite;
      }
      #initial-loader .name {
        font-size: 22px;
        font-weight: 800;
        letter-spacing: -0.01em;
      }
      #initial-loader .spinner {
        width: 28px;
        height: 28px;
        border: 3px solid rgba(0, 0, 0, 0.12);
        border-top-color: #ff5a3c;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes bounce {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-8px);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="initial-loader">
        <div class="emoji">🎊</div>
        <div class="name">Confetti</div>
        <div class="spinner"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
