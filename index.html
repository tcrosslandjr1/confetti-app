<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Confetti</title>
    <meta name="description" content="Your AI-powered lifestyle concierge" />
    <link rel="icon" type="image/svg+xml" href="/confetti-icon.svg" />
    <link rel="modulepreload" href="/src/router.tsx" />
    <link rel="preconnect" href="https://wnoukqhwjhzlopnlbnow.supabase.co" crossorigin />
    <style>
      /* Loader uses system fonts — app fonts load asynchronously via __root.tsx */

      #initial-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background: #faf8f5;
        font-family: "Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif;
        animation: loader-fade-in 0.5s ease-out both;
      }

      /* Heavy-blur color field — feels like the site, not a generic spinner */
      #initial-loader .orb {
        position: absolute;
        border-radius: 50%;
        filter: blur(120px);
        opacity: 0.55;
        pointer-events: none;
        will-change: transform;
      }
      #initial-loader .orb-1 {
        width: 620px; height: 620px;
        background: #ff7a4c;
        top: -180px; left: -120px;
        animation: orb-drift-1 18s ease-in-out infinite alternate;
      }
      #initial-loader .orb-2 {
        width: 520px; height: 520px;
        background: #ffc24a;
        bottom: -160px; right: -100px;
        animation: orb-drift-2 22s ease-in-out infinite alternate;
      }
      #initial-loader .orb-3 {
        width: 420px; height: 420px;
        background: #e63d57;
        top: 35%; left: 55%;
        animation: orb-drift-3 24s ease-in-out infinite alternate;
      }

      /* Confetti — small, soft, drifting behind the glass */
      #initial-loader .confetti-field {
        position: absolute; inset: 0;
        pointer-events: none; overflow: hidden; z-index: 1;
        filter: blur(0.4px);
      }
      #initial-loader .confetti-field i {
        position: absolute; top: -30px;
        width: 9px; height: 13px; border-radius: 2px;
        opacity: 0; animation: confetti-fall linear infinite;
        will-change: transform, opacity;
      }
      #initial-loader .confetti-field i:nth-child(3n) { border-radius: 50%; width: 6px; height: 6px; }
      #initial-loader .confetti-field i:nth-child(4n) { width: 4px; height: 16px; border-radius: 1px; }
      #initial-loader .confetti-field i:nth-child(5n) { width: 11px; height: 5px; border-radius: 1px; }

      /* Cursor spotlight — sits above orbs, below card */
      #initial-loader .spotlight {
        position: absolute; inset: 0; z-index: 1; pointer-events: none;
        background: radial-gradient(420px circle at var(--mx, 50%) var(--my, 50%),
          rgba(255, 224, 196, 0.55), transparent 60%);
        mix-blend-mode: soft-light;
        transition: background 0.2s ease-out;
      }
      /* Subtle noise grain for tactile depth */
      #initial-loader::after {
        content: ""; position: absolute; inset: 0; z-index: 1; pointer-events: none;
        opacity: 0.06; mix-blend-mode: multiply;
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.7'/></svg>");
      }

      /* Frosted brutalist card — matches the rest of the site */
      #initial-loader .stage {
        position: relative;
        display: flex; flex-direction: column;
        align-items: stretch; gap: 0;
        z-index: 2;
        width: min(440px, calc(100vw - 32px));
        padding: 26px 26px 20px;
        background: rgba(250, 248, 245, 0.94);
        backdrop-filter: blur(32px) saturate(150%);
        -webkit-backdrop-filter: blur(32px) saturate(150%);
        border: 2px solid #1a1a1a;
        border-radius: 24px;
        box-shadow:
          8px 8px 0 0 #1a1a1a,
          0 40px 80px -24px rgba(26,26,26,0.45),
          inset 0 1px 0 rgba(255,255,255,0.6);
        animation: card-in 0.6s cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      /* Soft halo behind the card */
      #initial-loader .stage::before {
        content: ""; position: absolute; inset: -40px; z-index: -1;
        background: radial-gradient(closest-side, rgba(255,122,76,0.35), transparent 70%);
        filter: blur(40px); opacity: 0.7;
        animation: halo-pulse 5s ease-in-out infinite;
      }
      @keyframes halo-pulse {
        0%,100% { opacity: 0.55; transform: scale(1); }
        50%     { opacity: 0.85; transform: scale(1.06); }
      }

      /* Header row: mark + name inline */
      #initial-loader .header {
        display: flex; align-items: center; gap: 14px;
        padding-bottom: 18px;
        border-bottom: 1.5px dashed rgba(26,26,26,0.2);
      }
      #initial-loader .mark {
        position: relative; width: 52px; height: 52px; flex-shrink: 0;
      }
      #initial-loader .mark svg { width: 100%; height: 100%; overflow: visible; }
      #initial-loader .mark .arc-bg {
        fill: none; stroke: #ff7a4c; stroke-width: 14; stroke-linecap: round;
        stroke-dasharray: 260; stroke-dashoffset: 260;
        animation: arc-draw 1s cubic-bezier(0.22, 1, 0.36, 1) 0.2s forwards;
      }
      #initial-loader .mark .arc-fg {
        fill: none; stroke: #1a1a1a; stroke-width: 14; stroke-linecap: round;
        stroke-dasharray: 260; stroke-dashoffset: 260;
        animation: arc-draw 1s cubic-bezier(0.22, 1, 0.36, 1) 0.4s forwards;
      }
      #initial-loader .mark::after {
        content: ""; position: absolute; inset: -8px;
        border-radius: 50%;
        border: 1.5px dashed rgba(255, 122, 76, 0.55);
        animation: mark-spin 8s linear infinite;
      }
      /* Sparkles orbiting the logo mark */
      #initial-loader .mark .spark {
        position: absolute; width: 5px; height: 5px; border-radius: 50%;
        background: #ff7a4c; box-shadow: 0 0 8px rgba(255,122,76,0.9);
        top: 50%; left: 50%; margin: -2.5px;
        transform-origin: 0 0;
      }
      #initial-loader .mark .spark.s1 { animation: spark-orbit 3.2s linear infinite; }
      #initial-loader .mark .spark.s2 { background:#ffc24a; box-shadow:0 0 8px rgba(255,194,74,.9); animation: spark-orbit 4.1s linear infinite reverse; animation-delay:-1s; }
      #initial-loader .mark .spark.s3 { background:#e63d57; box-shadow:0 0 8px rgba(230,61,87,.9); animation: spark-orbit 5s linear infinite; animation-delay:-2s; }
      @keyframes spark-orbit {
        from { transform: rotate(0deg) translateX(34px) rotate(0deg); }
        to   { transform: rotate(360deg) translateX(34px) rotate(-360deg); }
      }
      #initial-loader .name {
        font-size: 28px; font-weight: 800;
        letter-spacing: -0.03em; color: #1a1a1a; line-height: 1;
      }
      #initial-loader .name span {
        display: inline-block; opacity: 0;
        transform: translateY(8px);
        animation: letter-pop 0.45s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      }
      #initial-loader .header .meta {
        margin-left: auto; display: flex; flex-direction: column;
        align-items: flex-end; gap: 4px;
      }
      #initial-loader .header .pill {
        display: inline-flex; align-items: center; gap: 6px;
        font-family: "JetBrains Mono", ui-monospace, monospace;
        font-size: 10px; font-weight: 700;
        letter-spacing: 0.18em; text-transform: uppercase;
        color: #1a1a1a;
        background: #ff7a4c; padding: 4px 8px;
        border: 1.5px solid #1a1a1a; border-radius: 99px;
      }
      #initial-loader .header .pill .dot {
        width: 6px; height: 6px; border-radius: 50%;
        background: #1a1a1a; animation: dot-pulse 1.2s ease-in-out infinite;
      }

      /* AI Agent terminal — the centerpiece */
      #initial-loader .agents {
        padding: 18px 0 4px;
        display: flex; flex-direction: column; gap: 10px;
      }
      #initial-loader .agent {
        display: flex; align-items: center; gap: 10px;
        font-family: "JetBrains Mono", ui-monospace, monospace;
        font-size: 12px; font-weight: 500;
        color: rgba(26,26,26,0.72);
        opacity: 0;
        animation: agent-in 0.5s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      }
      #initial-loader .agent:nth-child(1) { animation-delay: 0.05s; }
      #initial-loader .agent:nth-child(2) { animation-delay: 0.15s; }
      #initial-loader .agent:nth-child(3) { animation-delay: 0.25s; }
      #initial-loader .agent:nth-child(4) { animation-delay: 0.35s; }
      #initial-loader .agent .tick {
        width: 16px; height: 16px; border-radius: 50%;
        display: inline-flex; align-items: center; justify-content: center;
        background: rgba(255, 122, 76, 0.18); color: #ff5a3c;
        font-size: 10px; font-weight: 900; flex-shrink: 0;
        position: relative;
      }
      #initial-loader .agent .tick::before {
        content: ""; position: absolute; inset: -2px; border-radius: 50%;
        border: 1.5px solid #ff7a4c; opacity: 0.4;
        animation: tick-ring 1.4s ease-out infinite;
      }
      #initial-loader .agent.done { color: #1a1a1a; }
      #initial-loader .agent.done .tick {
        background: #1a1a1a; color: #faf8f5;
      }
      #initial-loader .agent.done .tick::before { display: none; }
      #initial-loader .agent .label { flex: 1; }
      #initial-loader .agent .time {
        font-size: 10px; color: rgba(26,26,26,0.4); letter-spacing: 0.05em;
      }

      /* Live stats row */
      #initial-loader .stats {
        margin-top: 14px; padding-top: 12px;
        border-top: 1.5px dashed rgba(26,26,26,0.2);
        display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
      }
      #initial-loader .stat {
        display: flex; flex-direction: column; align-items: flex-start; gap: 2px;
        padding: 6px 8px; border-radius: 10px;
        background: rgba(255,255,255,0.35);
        border: 1px solid rgba(26,26,26,0.08);
      }
      #initial-loader .stat .num {
        font-family: "JetBrains Mono", ui-monospace, monospace;
        font-size: 16px; font-weight: 800; color: #1a1a1a;
        letter-spacing: -0.01em; line-height: 1;
        font-variant-numeric: tabular-nums;
      }
      #initial-loader .stat .lbl {
        font-family: "JetBrains Mono", ui-monospace, monospace;
        font-size: 8.5px; font-weight: 700;
        letter-spacing: 0.14em; text-transform: uppercase;
        color: rgba(26,26,26,0.55);
      }

      /* Mini city-map plan being drawn */
      #initial-loader .minimap {
        margin-top: 14px; padding: 10px;
        border-radius: 14px;
        background: linear-gradient(140deg, rgba(255,255,255,0.45), rgba(255,224,196,0.25));
        border: 1px solid rgba(26,26,26,0.1);
        position: relative; overflow: hidden;
      }
      #initial-loader .minimap svg { width: 100%; height: 92px; display: block; }
      #initial-loader .minimap .grid line { stroke: rgba(26,26,26,0.07); stroke-width: 0.5; }
      #initial-loader .minimap .road { stroke: rgba(26,26,26,0.18); stroke-width: 1.5; fill: none; stroke-linecap: round; }
      #initial-loader .minimap .route {
        stroke: #ff5a3c; stroke-width: 2.5; fill: none;
        stroke-linecap: round; stroke-linejoin: round;
        stroke-dasharray: 360; stroke-dashoffset: 360;
        filter: drop-shadow(0 1px 2px rgba(255,90,60,0.4));
        animation: route-draw 3.6s cubic-bezier(0.4, 0, 0.2, 1) 0.8s forwards,
                   route-pulse 2.4s ease-in-out 4.4s infinite;
      }
      #initial-loader .minimap .pin {
        opacity: 0; transform-origin: center;
        animation: pin-pop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      }
      #initial-loader .minimap .pin:nth-of-type(1) { animation-delay: 1.0s; }
      #initial-loader .minimap .pin:nth-of-type(2) { animation-delay: 1.8s; }
      #initial-loader .minimap .pin:nth-of-type(3) { animation-delay: 2.6s; }
      #initial-loader .minimap .pin:nth-of-type(4) { animation-delay: 3.4s; }
      #initial-loader .minimap .pin .ring {
        fill: none; stroke: #ff5a3c; stroke-width: 1.5;
        transform-box: fill-box; transform-origin: center;
        animation: pin-ring 1.8s ease-out infinite;
      }
      #initial-loader .minimap .traveler {
        fill: #1a1a1a;
        offset-path: path("M 12 70 Q 80 55 130 50 T 240 30 T 340 55");
        offset-distance: 0%;
        animation: travel 4.4s cubic-bezier(0.4, 0, 0.2, 1) 0.8s forwards;
      }
      #initial-loader .minimap .tag {
        position: absolute; top: 10px; right: 12px;
        font-family: "JetBrains Mono", ui-monospace, monospace;
        font-size: 8.5px; font-weight: 800; letter-spacing: 0.16em; text-transform: uppercase;
        color: #1a1a1a; background: rgba(255,255,255,0.7);
        padding: 3px 7px; border-radius: 99px;
        border: 1px solid rgba(26,26,26,0.15);
      }
      #initial-loader .minimap .tag .dot {
        display:inline-block; width:5px; height:5px; border-radius:50%;
        background:#ff5a3c; margin-right:5px; vertical-align: 1px;
        animation: dot-pulse 1.2s ease-in-out infinite;
      }
      @keyframes route-draw { to { stroke-dashoffset: 0; } }
      @keyframes route-pulse {
        0%,100% { filter: drop-shadow(0 1px 2px rgba(255,90,60,0.4)); }
        50%     { filter: drop-shadow(0 1px 6px rgba(255,90,60,0.85)); }
      }
      @keyframes pin-pop {
        0%   { opacity: 0; transform: translateY(-4px) scale(0.4); }
        60%  { opacity: 1; transform: translateY(0) scale(1.15); }
        100% { opacity: 1; transform: translateY(0) scale(1); }
      }
      @keyframes pin-ring {
        0%   { r: 4; opacity: 0.7; }
        100% { r: 11; opacity: 0; }
      }
      @keyframes travel { to { offset-distance: 100%; } }

      /* Shooting comet across the skyline */
      #initial-loader .comet {
        position: absolute; top: 18%; left: -10%;
        width: 120px; height: 2px; border-radius: 99px;
        background: linear-gradient(90deg, transparent, #fff, #ffc24a);
        filter: drop-shadow(0 0 6px rgba(255,194,74,0.9));
        transform: rotate(14deg);
        animation: comet-fly 7s ease-in 1.5s infinite;
        opacity: 0;
      }
      #initial-loader .comet.comet-2 {
        top: 36%; animation-delay: 4.5s; animation-duration: 9s;
        background: linear-gradient(90deg, transparent, #fff, #ff7a4c);
      }
      @keyframes comet-fly {
        0%   { transform: translate(0, 0) rotate(14deg); opacity: 0; }
        10%  { opacity: 1; }
        70%  { opacity: 0.9; }
        100% { transform: translate(130vw, 30vh) rotate(14deg); opacity: 0; }
      }


      /* Segmented progress strip */
      #initial-loader .progress-track {
        margin-top: 16px; padding-top: 14px;
        border-top: 1.5px dashed rgba(26,26,26,0.2);
        display: flex; gap: 4px; width: 100%;
      }
      #initial-loader .progress-track .bar {
        flex: 1; height: 4px; border-radius: 99px;
        background: rgba(26, 26, 26, 0.1);
        overflow: hidden; position: relative;
      }
      #initial-loader .progress-track .bar::after {
        content: ""; position: absolute; inset: 0; border-radius: 99px;
        background: linear-gradient(90deg, #ff5a3c, #ff9a3c);
        transform: translateX(-101%);
        animation: bar-fill 1.4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      #initial-loader .progress-track .bar:nth-child(2)::after { animation-delay: 0.15s; }
      #initial-loader .progress-track .bar:nth-child(3)::after { animation-delay: 0.3s; }
      #initial-loader .progress-track .bar:nth-child(4)::after { animation-delay: 0.45s; }
      #initial-loader .progress-track .bar:nth-child(5)::after { animation-delay: 0.6s; }

      #initial-loader .boot-retry {
        margin-top: 14px; width: 100%; min-height: 42px;
        border: 2px solid #1a1a1a; border-radius: 999px;
        background: #1a1a1a; color: #faf8f5;
        font-family: "JetBrains Mono", ui-monospace, monospace;
        font-size: 11px; font-weight: 800;
        letter-spacing: 0.16em; text-transform: uppercase;
        box-shadow: 4px 4px 0 0 #ff7a4c;
        cursor: pointer;
      }
      #initial-loader .boot-skip {
        margin-top: 8px; width: 100%; min-height: 36px;
        border: 1px solid rgba(26,26,26,0.25); border-radius: 999px;
        background: transparent; color: #1a1a1a;
        font-family: "JetBrains Mono", ui-monospace, monospace;
        font-size: 10px; font-weight: 700;
        letter-spacing: 0.14em; text-transform: uppercase;
        cursor: pointer;
      }
      #initial-loader .boot-reason {
        margin-top: 10px; font-family: "JetBrains Mono", ui-monospace, monospace;
        font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase;
        color: #b04a1f;
      }
      #initial-loader[data-boot-stalled] .progress-track .bar::after {
        animation-duration: 0.7s;
        background: linear-gradient(90deg, #1a1a1a, #ff7a4c);
      }
      #initial-loader[data-boot-stalled] .agents,
      #initial-loader[data-boot-stalled] .ticker { opacity: 0.45; }

      /* Keyframes */
      @keyframes loader-fade-in { from { opacity: 0; } to { opacity: 1; } }
      @keyframes card-in {
        from { opacity: 0; transform: translateY(8px) scale(0.985); }
        to   { opacity: 1; transform: translateY(0) scale(1); }
      }
      @keyframes orb-drift-1 {
        0%   { transform: translate(0, 0) scale(1); }
        100% { transform: translate(60px, 80px) scale(1.15); }
      }
      @keyframes orb-drift-2 {
        0%   { transform: translate(0, 0) scale(1); }
        100% { transform: translate(-50px, -60px) scale(1.2); }
      }
      @keyframes orb-drift-3 {
        0%   { transform: translate(0, 0) scale(1); }
        100% { transform: translate(70px, -40px) scale(0.9); }
      }
      @keyframes arc-draw { to { stroke-dashoffset: 0; } }
      @keyframes mark-spin { to { transform: rotate(360deg); } }
      @keyframes letter-pop { to { opacity: 1; transform: translateY(0); } }
      @keyframes agent-in {
        from { opacity: 0; transform: translateX(-6px); }
        to   { opacity: 1; transform: translateX(0); }
      }
      @keyframes tick-ring {
        0%   { transform: scale(0.9); opacity: 0.5; }
        100% { transform: scale(1.6); opacity: 0; }
      }
      @keyframes dot-pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50%      { opacity: 0.4; transform: scale(0.7); }
      }
      @keyframes confetti-fall {
        0%   { transform: translate3d(0, -10vh, 0) rotate(0deg); opacity: 0; }
        10%  { opacity: 0.7; }
        100% { transform: translate3d(var(--dx, 40px), 110vh, 0) rotate(720deg); opacity: 0.6; }
      }
      @keyframes bar-fill {
        0%   { transform: translateX(-101%); }
        50%  { transform: translateX(0); }
        100% { transform: translateX(101%); }
      }

      /* Skyline silhouette */
      #initial-loader .skyline {
        position: absolute; left: 0; right: 0; bottom: 0;
        height: 120px; z-index: 1; pointer-events: none;
        opacity: 0.9;
        mask-image: linear-gradient(to bottom, transparent, #000 55%);
        -webkit-mask-image: linear-gradient(to bottom, transparent, #000 55%);
      }
      #initial-loader .skyline svg { width: 100%; height: 100%; display: block; }
      #initial-loader .skyline .win { animation: window-flicker 4s ease-in-out infinite; }
      #initial-loader .skyline .win:nth-child(odd) { animation-delay: 1.2s; }
      #initial-loader .skyline .win:nth-child(3n) { animation-delay: 2.4s; }
      @keyframes window-flicker {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.25; }
      }

      /* Live "now scanning" ticker */
      #initial-loader .ticker {
        margin-top: 14px; padding-top: 12px;
        border-top: 1.5px dashed rgba(26,26,26,0.18);
        display: flex; align-items: center; gap: 8px;
        font-family: "JetBrains Mono", ui-monospace, monospace;
        font-size: 10px; font-weight: 700;
        letter-spacing: 0.14em; text-transform: uppercase;
        color: rgba(26,26,26,0.55);
        overflow: hidden;
      }
      #initial-loader .ticker .scan-dot {
        width: 6px; height: 6px; border-radius: 50%;
        background: #ff5a3c; flex-shrink: 0;
        animation: scan-pulse 1.4s ease-out infinite;
      }
      #initial-loader .ticker .scan-label { flex-shrink: 0; color: #1a1a1a; }
      #initial-loader .ticker .scan-text {
        flex: 1; min-width: 0; position: relative; height: 14px;
      }
      #initial-loader .ticker .scan-text span {
        position: absolute; inset: 0;
        display: flex; align-items: center;
        opacity: 0; white-space: nowrap;
        animation: scan-cycle 12s ease-in-out infinite;
      }
      #initial-loader .ticker .scan-text span:nth-child(1) { animation-delay: 0s; }
      #initial-loader .ticker .scan-text span:nth-child(2) { animation-delay: 3s; }
      #initial-loader .ticker .scan-text span:nth-child(3) { animation-delay: 6s; }
      #initial-loader .ticker .scan-text span:nth-child(4) { animation-delay: 9s; }
      @keyframes scan-cycle {
        0%, 22%   { opacity: 1; transform: translateY(0); }
        25%, 100% { opacity: 0; transform: translateY(-6px); }
      }
      @keyframes scan-pulse {
        0%   { box-shadow: 0 0 0 0 rgba(255,90,60,0.55); }
        100% { box-shadow: 0 0 0 8px rgba(255,90,60,0); }
      }

      /* Pointer parallax tilt */
      #initial-loader .stage {
        transform: perspective(900px) rotateX(var(--ry, 0deg)) rotateY(var(--rx, 0deg));
        transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1);
      }

      @media (prefers-reduced-motion: reduce) {
        #initial-loader *,
        #initial-loader *::before,
        #initial-loader *::after { animation: none !important; }
        #initial-loader .arc-bg,
        #initial-loader .arc-fg { stroke-dashoffset: 0 !important; }
        #initial-loader .name span,
        #initial-loader .agent,
        #initial-loader .ticker .scan-text span:first-child { opacity: 1 !important; transform: none !important; }
      }


      html[data-admin-splash] #initial-loader {
        background: #faf8f5;
      }
      html[data-admin-splash] #initial-loader .orb,
      html[data-admin-splash] #initial-loader .confetti-field {
        display: none;
      }
      html[data-admin-splash] #initial-loader .mark::after {
        border-color: rgba(26, 26, 26, 0.18);
      }
      html[data-admin-splash] #initial-loader .mark .arc-bg {
        stroke: #ff7a4c;
      }
      html[data-admin-splash] #initial-loader .mark .arc-fg {
        stroke: #1a1a1a;
      }
      html[data-admin-splash] #initial-loader .name::after {
        content: "Admin Console";
        display: block;
        margin-top: 10px;
        font-family: "JetBrains Mono", ui-monospace, monospace;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: rgba(26, 26, 26, 0.55);
      }
      html[data-admin-splash] #initial-loader .pill { background: #1a1a1a; color: #faf8f5; }
      html[data-admin-splash] #initial-loader .pill .dot { background: #ff7a4c; }

      /* Live equalizer next to Live pill */
      #initial-loader .eq {
        display: inline-flex; align-items: flex-end; gap: 2px;
        height: 14px; margin-left: 8px; vertical-align: -2px;
      }
      #initial-loader .eq i {
        display: block; width: 2.5px; height: 4px; border-radius: 1px;
        background: linear-gradient(180deg, #ff5a3c, #ffc24a);
        animation: eq-bounce 1s ease-in-out infinite;
        transform-origin: bottom;
      }
      #initial-loader .eq i:nth-child(1) { animation-delay: -0.9s; }
      #initial-loader .eq i:nth-child(2) { animation-delay: -0.6s; }
      #initial-loader .eq i:nth-child(3) { animation-delay: -0.3s; }
      #initial-loader .eq i:nth-child(4) { animation-delay: -0.7s; }
      #initial-loader .eq i:nth-child(5) { animation-delay: -0.2s; }
      @keyframes eq-bounce {
        0%, 100% { transform: scaleY(0.4); }
        50%      { transform: scaleY(2.4); }
      }

      /* Flipping venue cards */
      #initial-loader .venues {
        margin-top: 14px; position: relative; height: 56px;
        border: 1px solid rgba(26,26,26,0.1);
        border-radius: 14px; overflow: hidden;
        background: linear-gradient(135deg, rgba(255,154,60,0.06), rgba(230,61,87,0.04));
      }
      #initial-loader .venues .v-card {
        position: absolute; inset: 0;
        display: grid; grid-template-columns: 36px 1fr auto;
        align-items: center; gap: 10px; padding: 0 12px;
        opacity: 0; transform: translateY(8px);
        animation: vcard-cycle 9s ease-in-out infinite;
      }
      #initial-loader .venues .v-card:nth-child(1) { animation-delay: 0s; }
      #initial-loader .venues .v-card:nth-child(2) { animation-delay: 3s; }
      #initial-loader .venues .v-card:nth-child(3) { animation-delay: 6s; }
      #initial-loader .venues .v-thumb {
        width: 36px; height: 36px; border-radius: 10px;
        background: linear-gradient(135deg, var(--c1, #ff5a3c), var(--c2, #ffc24a));
        position: relative; flex-shrink: 0;
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.4), 0 2px 6px rgba(255,90,60,0.25);
      }
      #initial-loader .venues .v-thumb::after {
        content: ""; position: absolute; inset: 6px;
        background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.85), transparent 60%);
        border-radius: 6px;
      }
      #initial-loader .venues .v-meta { min-width: 0; }
      #initial-loader .venues .v-name {
        font-family: "Instrument Serif", "Cormorant Garamond", serif;
        font-size: 17px; font-weight: 400; color: #1a1a1a;
        line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }
      #initial-loader .venues .v-sub {
        font-family: "JetBrains Mono", ui-monospace, monospace;
        font-size: 9px; font-weight: 700; letter-spacing: 0.14em;
        text-transform: uppercase; color: rgba(26,26,26,0.55);
        margin-top: 2px;
      }
      #initial-loader .venues .v-score {
        font-family: "JetBrains Mono", ui-monospace, monospace;
        font-size: 10px; font-weight: 800; letter-spacing: 0.1em;
        color: #1a1a1a; background: #fff;
        padding: 4px 7px; border-radius: 99px;
        border: 1px solid rgba(26,26,26,0.12);
        box-shadow: 1.5px 1.5px 0 0 #ff7a4c;
      }
      @keyframes vcard-cycle {
        0%, 2%   { opacity: 0; transform: translateY(10px); }
        8%, 30%  { opacity: 1; transform: translateY(0); }
        36%, 100%{ opacity: 0; transform: translateY(-10px); }
      }

      /* Neighborhood marquee */
      #initial-loader .hoods {
        margin-top: 12px; overflow: hidden; position: relative;
        mask-image: linear-gradient(to right, transparent, #000 8%, #000 92%, transparent);
        -webkit-mask-image: linear-gradient(to right, transparent, #000 8%, #000 92%, transparent);
      }
      #initial-loader .hoods .track {
        display: inline-flex; gap: 8px; white-space: nowrap;
        animation: hoods-scroll 22s linear infinite;
        padding-right: 8px;
      }
      #initial-loader .hoods .chip {
        font-family: "JetBrains Mono", ui-monospace, monospace;
        font-size: 9.5px; font-weight: 800; letter-spacing: 0.14em;
        text-transform: uppercase; color: #1a1a1a;
        padding: 5px 10px; border-radius: 99px;
        background: rgba(255,255,255,0.7);
        border: 1px solid rgba(26,26,26,0.12);
      }
      #initial-loader .hoods .chip .pip {
        display: inline-block; width: 5px; height: 5px;
        border-radius: 50%; background: #ff5a3c; margin-right: 5px;
        vertical-align: 1px;
      }
      #initial-loader .hoods .chip.hot { background: #1a1a1a; color: #faf8f5; border-color: #1a1a1a; }
      #initial-loader .hoods .chip.hot .pip { background: #ffc24a; }
      @keyframes hoods-scroll {
        from { transform: translateX(0); }
        to   { transform: translateX(-50%); }
      }


      /* ── Mobile pass (≤480px) — tighten loader so it fits one phone screen ── */
      @media (max-width: 480px) {
        #initial-loader .orb { filter: blur(90px); opacity: 0.45; }
        #initial-loader .orb-1 { width: 380px; height: 380px; top: -120px; left: -80px; }
        #initial-loader .orb-2 { width: 340px; height: 340px; bottom: -120px; right: -80px; }
        #initial-loader .orb-3 { width: 260px; height: 260px; }
        #initial-loader .skyline { height: 70px; opacity: 0.7; }
        #initial-loader .comet { display: none; }

        #initial-loader .stage {
          width: calc(100vw - 20px);
          padding: 16px 16px 14px;
          border-radius: 20px;
          box-shadow: 5px 5px 0 0 #1a1a1a, 0 24px 48px -20px rgba(26,26,26,0.4);
          /* Disable parallax tilt on touch */
          transform: none !important;
        }
        #initial-loader .stage::before { inset: -20px; }

        #initial-loader .header { padding-bottom: 12px; gap: 10px; }
        #initial-loader .mark { width: 40px; height: 40px; }
        #initial-loader .mark::after { inset: -5px; }
        @keyframes spark-orbit {
          from { transform: rotate(0deg) translateX(26px) rotate(0deg); }
          to   { transform: rotate(360deg) translateX(26px) rotate(-360deg); }
        }
        #initial-loader .name { font-size: 22px; }
        #initial-loader .header .pill { font-size: 9px; padding: 3px 7px; letter-spacing: 0.14em; }
        #initial-loader .eq { height: 12px; margin-left: 6px; }

        #initial-loader .agents { padding: 12px 0 2px; gap: 7px; }
        #initial-loader .agent { font-size: 11px; gap: 8px; }
        #initial-loader .agent .tick { width: 14px; height: 14px; font-size: 9px; }
        #initial-loader .agent .time { font-size: 9px; }

        #initial-loader .stats { margin-top: 10px; padding-top: 10px; gap: 6px; }
        #initial-loader .stat { padding: 5px 6px; border-radius: 8px; }
        #initial-loader .stat .num { font-size: 14px; }
        #initial-loader .stat .lbl { font-size: 7.5px; letter-spacing: 0.12em; }

        #initial-loader .minimap { margin-top: 10px; padding: 8px; border-radius: 12px; }
        #initial-loader .minimap svg { height: 68px; }
        #initial-loader .minimap .tag { font-size: 7.5px; padding: 2px 6px; top: 7px; right: 8px; }

        #initial-loader .venues { margin-top: 10px; height: 48px; border-radius: 12px; }
        #initial-loader .venues .v-card { grid-template-columns: 30px 1fr auto; gap: 8px; padding: 0 10px; }
        #initial-loader .venues .v-thumb { width: 30px; height: 30px; border-radius: 8px; }
        #initial-loader .venues .v-name { font-size: 15px; }
        #initial-loader .venues .v-sub { font-size: 8px; }
        #initial-loader .venues .v-score { font-size: 9px; padding: 3px 6px; }

        #initial-loader .hoods { margin-top: 8px; }
        #initial-loader .hoods .chip { font-size: 8.5px; padding: 4px 8px; }

        #initial-loader .ticker { margin-top: 10px; padding-top: 10px; font-size: 9px; gap: 6px; }
        #initial-loader .ticker .scan-text { height: 12px; }

        #initial-loader .progress-track { margin-top: 12px; padding-top: 10px; }
        #initial-loader .progress-track .bar { height: 3px; }

        #initial-loader .boot-retry { margin-top: 10px; min-height: 38px; font-size: 10px; }
        #initial-loader .boot-skip { min-height: 32px; font-size: 9px; }
      }

      /* Very short screens — hide the non-essential animated extras to avoid scroll */
      @media (max-width: 480px) and (max-height: 720px) {
        #initial-loader .minimap,
        #initial-loader .hoods,
        #initial-loader .skyline { display: none; }
        #initial-loader .stage { padding: 14px 14px 12px; }
      }
    </style>
  </head>
  <body>
    <script>
      // Skip the consumer-branded splash on portal/console shells — they have
      // their own matching skeletons rendered by React.
      (function () {
        try {
          var p = location.pathname;
          if (/^\/admin(\/|$)/.test(p)) {
            document.documentElement.setAttribute("data-no-splash", "");
          } else if (/^\/(partner|corporate|advertise\/portal|business|concierge|portal)(\/|$)/.test(p)) {
            document.documentElement.setAttribute("data-no-splash", "");
          }
        } catch (_) {}
      })();
    </script>
    <style>
      html[data-no-splash] #initial-loader { display: none !important; }
    </style>
    <div id="root">
    </div>
    <script>
      // SPA redirect recovery: if the user hit a non-root URL directly and
      // was bounced here via public/404.html, restore the original path so
      // TanStack Router initialises on the correct route.
      (function () {
        var r = sessionStorage.getItem('__spa_redirect__');
        if (r) {
          sessionStorage.removeItem('__spa_redirect__');
          history.replaceState(null, '', r);
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
