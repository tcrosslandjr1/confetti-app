<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Confetti</title>
    <meta name="description" content="Your AI-powered lifestyle concierge" />
    <meta name="theme-color" content="#EE5A9D" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Confetti" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="modulepreload" href="/src/router.tsx" />
    <link rel="preconnect" href="https://wnoukqhwjhzlopnlbnow.supabase.co" crossorigin />
  </head>
  <body>
    <div id="root">
    </div>
    <script>
      // SPA redirect recovery: if the user hit a non-root URL directly and
      // was bounced here via public/404.html, restore the original path so
      // TanStack Router initialises on the correct route.
      (function () {
        var r = sessionStorage.getItem('__spa_redirect__');
        if (r) {
          sessionStorage.removeItem('__spa_redirect__');
          history.replaceState(null, '', r);
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Register service worker for PWA + offline support
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () {
          navigator.serviceWorker.register("/sw.js").catch(function (err) {
            console.warn("SW registration failed:", err);
          });
        });
      }
    </script>
  </body>
</html>
