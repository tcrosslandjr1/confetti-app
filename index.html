<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Confetti</title>
    <meta name="description" content="Your AI-powered lifestyle concierge" />
    <link rel="icon" type="image/svg+xml" href="/confetti-icon.svg" />
    <style>
      #initial-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        color: #1a1a1a;
        overflow: hidden;
        background:
          radial-gradient(1000px 600px at 15% -10%, rgba(255, 145, 110, 0.55), transparent 60%),
          radial-gradient(900px 500px at 110% 110%, rgba(255, 196, 90, 0.55), transparent 55%),
          radial-gradient(700px 500px at 50% 120%, rgba(230, 61, 87, 0.25), transparent 60%),
          linear-gradient(180deg, #fff8f0 0%, #ffe6d2 100%);
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        animation: loader-fade-in 0.4s ease-out both;
      }
      /* Soft animated aurora wash */
      #initial-loader::before {
        content: "";
        position: absolute;
        inset: -20%;
        background:
          radial-gradient(40% 30% at 30% 30%, rgba(255, 122, 76, 0.35), transparent 70%),
          radial-gradient(35% 25% at 70% 60%, rgba(255, 196, 74, 0.35), transparent 70%),
          radial-gradient(30% 25% at 50% 80%, rgba(230, 61, 87, 0.3), transparent 70%);
        filter: blur(40px);
        animation: aurora 12s ease-in-out infinite alternate;
        pointer-events: none;
      }
      /* Subtle grain overlay */
      #initial-loader::after {
        content: "";
        position: absolute;
        inset: 0;
        background-image: radial-gradient(rgba(0, 0, 0, 0.05) 1px, transparent 1px);
        background-size: 3px 3px;
        opacity: 0.35;
        mix-blend-mode: multiply;
        pointer-events: none;
      }
      #initial-loader .confetti-field {
        position: absolute;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
        z-index: 1;
      }
      #initial-loader .confetti-field i {
        position: absolute;
        top: -24px;
        width: 10px;
        height: 14px;
        border-radius: 2px;
        opacity: 0;
        animation: confetti-fall linear infinite;
        will-change: transform, opacity;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
      }
      #initial-loader .confetti-field i:nth-child(3n) {
        border-radius: 50%;
        width: 8px;
        height: 8px;
      }
      #initial-loader .confetti-field i:nth-child(4n) {
        width: 6px;
        height: 16px;
        border-radius: 1px;
      }
      #initial-loader .stage {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
        z-index: 2;
      }
      /* Glow halo behind badge */
      #initial-loader .halo {
        position: absolute;
        top: -28px;
        width: 180px;
        height: 180px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(255, 122, 76, 0.45), transparent 65%);
        filter: blur(8px);
        animation: halo-pulse 2.6s ease-in-out infinite;
        z-index: -1;
      }
      #initial-loader .badge {
        position: relative;
        width: 104px;
        height: 104px;
        border-radius: 30px;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 30% 25%, rgba(255, 255, 255, 0.55), transparent 55%),
          linear-gradient(135deg, #ff7a4c 0%, #ff5a3c 55%, #e63d57 100%);
        box-shadow:
          0 22px 50px -14px rgba(230, 61, 87, 0.6),
          0 8px 20px -8px rgba(255, 122, 76, 0.55),
          inset 0 1px 0 rgba(255, 255, 255, 0.55),
          inset 0 -6px 14px rgba(0, 0, 0, 0.1);
        animation:
          badge-pop 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) both,
          badge-float 4s ease-in-out 0.7s infinite;
      }
      #initial-loader .badge::before {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 30px;
        background: linear-gradient(
          120deg,
          transparent 30%,
          rgba(255, 255, 255, 0.45) 50%,
          transparent 70%
        );
        background-size: 200% 100%;
        animation: badge-sheen 3s ease-in-out infinite;
        pointer-events: none;
      }
      #initial-loader .badge::after {
        content: "";
        position: absolute;
        inset: -8px;
        border-radius: 36px;
        border: 2px dashed rgba(255, 122, 76, 0.5);
        animation: spin 8s linear infinite;
      }
      #initial-loader .emoji {
        font-size: 56px;
        line-height: 1;
        filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.18));
        animation: bounce 1.6s ease-in-out infinite;
        position: relative;
        z-index: 1;
      }
      #initial-loader .name {
        font-size: 34px;
        font-weight: 900;
        letter-spacing: -0.025em;
        background: linear-gradient(
          90deg,
          #1a1a1a 0%,
          #e63d57 35%,
          #ff7a4c 50%,
          #e63d57 65%,
          #1a1a1a 100%
        );
        background-size: 200% 100%;
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: shimmer 2.8s ease-in-out infinite;
      }
      #initial-loader .tagline {
        font-size: 12px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.28em;
        color: rgba(26, 26, 26, 0.55);
        position: relative;
        padding: 0 18px;
      }
      #initial-loader .tagline::before,
      #initial-loader .tagline::after {
        content: "";
        position: absolute;
        top: 50%;
        width: 14px;
        height: 1px;
        background: rgba(26, 26, 26, 0.25);
      }
      #initial-loader .tagline::before {
        left: 0;
      }
      #initial-loader .tagline::after {
        right: 0;
      }
      #initial-loader .progress {
        margin-top: 6px;
        width: 160px;
        height: 4px;
        border-radius: 99px;
        background: rgba(26, 26, 26, 0.08);
        overflow: hidden;
        position: relative;
      }
      #initial-loader .progress::after {
        content: "";
        position: absolute;
        inset: 0;
        width: 40%;
        border-radius: 99px;
        background: linear-gradient(90deg, #ff5a3c, #ff9a3c, #ffc24a);
        animation: progress-slide 1.6s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes bounce {
        0%,
        100% {
          transform: translateY(0) rotate(-5deg) scale(1);
        }
        50% {
          transform: translateY(-12px) rotate(5deg) scale(1.05);
        }
      }
      @keyframes shimmer {
        0%,
        100% {
          background-position: 200% 0;
        }
        50% {
          background-position: 0 0;
        }
      }
      @keyframes badge-pop {
        0% {
          transform: scale(0.6) rotate(-8deg);
          opacity: 0;
        }
        100% {
          transform: scale(1) rotate(0);
          opacity: 1;
        }
      }
      @keyframes badge-float {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-6px);
        }
      }
      @keyframes badge-sheen {
        0% {
          background-position: 200% 0;
        }
        100% {
          background-position: -100% 0;
        }
      }
      @keyframes halo-pulse {
        0%,
        100% {
          opacity: 0.6;
          transform: scale(1);
        }
        50% {
          opacity: 1;
          transform: scale(1.12);
        }
      }
      @keyframes aurora {
        0% {
          transform: translate(0, 0) rotate(0deg);
        }
        100% {
          transform: translate(4%, -3%) rotate(8deg);
        }
      }
      @keyframes loader-fade-in {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      @keyframes confetti-fall {
        0% {
          transform: translate3d(0, -10vh, 0) rotate(0deg);
          opacity: 0;
        }
        10% {
          opacity: 1;
        }
        100% {
          transform: translate3d(var(--dx, 40px), 110vh, 0) rotate(720deg);
          opacity: 0.9;
        }
      }
      @keyframes progress-slide {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(350%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #initial-loader *,
        #initial-loader *::before,
        #initial-loader *::after {
          animation: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="initial-loader">
        <div class="confetti-field" aria-hidden="true">
          <i style="left: 5%; --dx: 60px; background: #ff5a3c; animation-duration: 4.2s; animation-delay: 0s;"></i>
          <i style="left: 12%; --dx: -40px; background: #ff9a3c; animation-duration: 5.1s; animation-delay: 0.6s;"></i>
          <i style="left: 20%; --dx: 30px; background: #ffc24a; animation-duration: 3.8s; animation-delay: 1.2s;"></i>
          <i style="left: 28%; --dx: -50px; background: #e63d57; animation-duration: 4.6s; animation-delay: 0.3s;"></i>
          <i style="left: 36%; --dx: 70px; background: #ff7a4c; animation-duration: 5.3s; animation-delay: 1.5s;"></i>
          <i style="left: 44%; --dx: -30px; background: #ffc24a; animation-duration: 4s; animation-delay: 0.9s;"></i>
          <i style="left: 52%; --dx: 50px; background: #ff5a3c; animation-duration: 4.8s; animation-delay: 0.2s;"></i>
          <i style="left: 60%; --dx: -60px; background: #ff9a3c; animation-duration: 5.5s; animation-delay: 1.1s;"></i>
          <i style="left: 68%; --dx: 20px; background: #e63d57; animation-duration: 4.4s; animation-delay: 1.8s;"></i>
          <i style="left: 76%; --dx: -45px; background: #ff7a4c; animation-duration: 4.9s; animation-delay: 0.5s;"></i>
          <i style="left: 84%; --dx: 55px; background: #ffc24a; animation-duration: 5.2s; animation-delay: 1.4s;"></i>
          <i style="left: 92%; --dx: -25px; background: #ff5a3c; animation-duration: 4.1s; animation-delay: 0.8s;"></i>
        </div>
        <div class="stage">
          <div class="halo" aria-hidden="true"></div>
          <div class="badge"><div class="emoji">🎊</div></div>
          <div class="name">Confetti</div>
          <div class="tagline">Curating your night</div>
          <div class="progress" aria-hidden="true"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
