<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Confetti</title>
    <meta name="description" content="Confetti — AI-powered dining, nightlife & experience planning for DC, MD & VA. Discover curated spots, plan group outings, and unlock the city." />
    <meta name="theme-color" content="#EE5A9D" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://ai-lifestyle-concierge.vercel.app/" />
    <meta property="og:title" content="Confetti — Your AI-Powered Lifestyle Concierge" />
    <meta property="og:description" content="Discover curated dining, nightlife & experiences in DC, MD & VA. AI-powered planning for unforgettable outings." />
    <meta property="og:image" content="https://ai-lifestyle-concierge.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="Confetti" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Confetti — Your AI-Powered Lifestyle Concierge" />
    <meta name="twitter:description" content="Discover curated dining, nightlife & experiences in DC, MD & VA. AI-powered planning for unforgettable outings." />
    <meta name="twitter:image" content="https://ai-lifestyle-concierge.vercel.app/og-image.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Confetti" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="modulepreload" href="/src/router.tsx" />
    <link rel="preconnect" href="https://zfeckvxkulreyapadanf.supabase.co" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Bricolage+Grotesque:wght@600;700;800;900&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root">
      <div style="display:flex;align-items:center;justify-content:center;min-height:100dvh;background:#faf9f6">
        <style>
          @keyframes cfspin{to{transform:rotate(360deg)}}
          .cf-loader{width:36px;height:36px;border:3px solid #f0e6e0;border-top-color:#EE5A9D;border-radius:50%;animation:cfspin .7s linear infinite}
        </style>
        <div class="cf-loader"></div>
      </div>
    </div>
    <script>
      // SPA redirect recovery: if the user hit a non-root URL directly and
      // was bounced here via public/404.html, restore the original path so
      // TanStack Router initialises on the correct route.
      (function () {
        var r = sessionStorage.getItem('__spa_redirect__');
        if (r) {
          sessionStorage.removeItem('__spa_redirect__');
          history.replaceState(null, '', r);
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Register service worker for PWA + offline support
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () {
          navigator.serviceWorker.register("/sw.js").catch(function (err) {
            console.warn("SW registration failed:", err);
          });
        });
      }
    </script>
  </body>
</html>
