<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Confetti</title>
    <meta name="description" content="Your AI-powered lifestyle concierge" />
    <link rel="icon" type="image/svg+xml" href="/confetti-icon.svg" />
    <style>
      /* Loader uses system fonts — app fonts load asynchronously via __root.tsx */

      #initial-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background: #faf8f5;
        font-family: "Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif;
        animation: loader-fade-in 0.5s ease-out both;
      }

      /* Floating color orbs behind everything */
      #initial-loader .orb {
        position: absolute;
        border-radius: 50%;
        filter: blur(60px);
        opacity: 0.35;
        pointer-events: none;
        will-change: transform;
      }
      #initial-loader .orb-1 {
        width: 500px;
        height: 500px;
        background: #ff7a4c;
        top: -120px;
        left: -80px;
        animation: orb-drift-1 14s ease-in-out infinite alternate;
      }
      #initial-loader .orb-2 {
        width: 400px;
        height: 400px;
        background: #ffc24a;
        bottom: -100px;
        right: -60px;
        animation: orb-drift-2 16s ease-in-out infinite alternate;
      }
      #initial-loader .orb-3 {
        width: 300px;
        height: 300px;
        background: #e63d57;
        top: 40%;
        left: 60%;
        animation: orb-drift-3 18s ease-in-out infinite alternate;
      }

      /* Confetti field — architectural tumbling shapes */
      #initial-loader .confetti-field {
        position: absolute;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
        z-index: 1;
      }
      #initial-loader .confetti-field i {
        position: absolute;
        top: -30px;
        width: 10px;
        height: 14px;
        border-radius: 2px;
        opacity: 0;
        animation: confetti-fall linear infinite;
        will-change: transform, opacity;
      }
      #initial-loader .confetti-field i:nth-child(3n) {
        border-radius: 50%;
        width: 7px;
        height: 7px;
      }
      #initial-loader .confetti-field i:nth-child(4n) {
        width: 5px;
        height: 18px;
        border-radius: 1px;
      }
      #initial-loader .confetti-field i:nth-child(5n) {
        width: 12px;
        height: 6px;
        border-radius: 1px;
      }

      /* Central stage */
      #initial-loader .stage {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 24px;
        z-index: 2;
      }

      /* The mark — an animated "C" built from two arcs */
      #initial-loader .mark {
        position: relative;
        width: 96px;
        height: 96px;
      }
      #initial-loader .mark svg {
        width: 100%;
        height: 100%;
        overflow: visible;
      }
      #initial-loader .mark .arc-bg {
        fill: none;
        stroke: #ff7a4c;
        stroke-width: 14;
        stroke-linecap: round;
        stroke-dasharray: 260;
        stroke-dashoffset: 260;
        animation: arc-draw 1s cubic-bezier(0.22, 1, 0.36, 1) 0.2s forwards;
      }
      #initial-loader .mark .arc-fg {
        fill: none;
        stroke: #1a1a1a;
        stroke-width: 14;
        stroke-linecap: round;
        stroke-dasharray: 260;
        stroke-dashoffset: 260;
        animation: arc-draw 1s cubic-bezier(0.22, 1, 0.36, 1) 0.4s forwards;
      }
      #initial-loader .mark::after {
        content: "";
        position: absolute;
        inset: -18px;
        border-radius: 50%;
        border: 2px dashed rgba(255, 122, 76, 0.35);
        animation: mark-spin 10s linear infinite;
      }

      /* Brand name */
      #initial-loader .name {
        font-size: 36px;
        font-weight: 800;
        letter-spacing: -0.03em;
        color: #1a1a1a;
        line-height: 1;
      }
      #initial-loader .name span {
        display: inline-block;
        opacity: 0;
        transform: translateY(12px);
        animation: letter-pop 0.5s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      }

      /* Tagline that cycles */
      #initial-loader .tagline-box {
        height: 22px;
        overflow: hidden;
        position: relative;
      }
      #initial-loader .tagline-track {
        display: flex;
        flex-direction: column;
        animation: tagline-cycle 6s cubic-bezier(0.22, 1, 0.36, 1) infinite;
      }
      #initial-loader .tagline {
        font-family: "JetBrains Mono", ui-monospace, monospace;
        font-size: 11px;
        font-weight: 500;
        text-transform: uppercase;
        letter-spacing: 0.22em;
        color: rgba(26, 26, 26, 0.45);
        height: 22px;
        display: flex;
        align-items: center;
        justify-content: center;
        white-space: nowrap;
      }

      /* Progress — a segmented bar */
      #initial-loader .progress-track {
        margin-top: 4px;
        display: flex;
        gap: 4px;
        width: 140px;
      }
      #initial-loader .progress-track .bar {
        flex: 1;
        height: 3px;
        border-radius: 99px;
        background: rgba(26, 26, 26, 0.08);
        overflow: hidden;
        position: relative;
      }
      #initial-loader .progress-track .bar::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 99px;
        background: linear-gradient(90deg, #ff5a3c, #ff9a3c);
        transform: translateX(-101%);
        animation: bar-fill 1.4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      #initial-loader .progress-track .bar:nth-child(2)::after { animation-delay: 0.15s; }
      #initial-loader .progress-track .bar:nth-child(3)::after { animation-delay: 0.3s; }
      #initial-loader .progress-track .bar:nth-child(4)::after { animation-delay: 0.45s; }
      #initial-loader .progress-track .bar:nth-child(5)::after { animation-delay: 0.6s; }

      /* Keyframes */
      @keyframes loader-fade-in {
        from { opacity: 0; }
        to   { opacity: 1; }
      }
      @keyframes orb-drift-1 {
        0%   { transform: translate(0, 0) scale(1); }
        100% { transform: translate(30px, 40px) scale(1.08); }
      }
      @keyframes orb-drift-2 {
        0%   { transform: translate(0, 0) scale(1); }
        100% { transform: translate(-20px, -30px) scale(1.12); }
      }
      @keyframes orb-drift-3 {
        0%   { transform: translate(0, 0) scale(1); }
        100% { transform: translate(40px, -20px) scale(0.95); }
      }
      @keyframes arc-draw {
        to { stroke-dashoffset: 0; }
      }
      @keyframes mark-spin {
        to { transform: rotate(360deg); }
      }
      @keyframes letter-pop {
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes tagline-cycle {
        0%, 20%    { transform: translateY(0); }
        25%, 45%   { transform: translateY(-22px); }
        50%, 70%   { transform: translateY(-44px); }
        75%, 95%   { transform: translateY(-66px); }
        100%       { transform: translateY(-88px); }
      }
      @keyframes confetti-fall {
        0%   { transform: translate3d(0, -10vh, 0) rotate(0deg); opacity: 0; }
        10%  { opacity: 1; }
        100% { transform: translate3d(var(--dx, 40px), 110vh, 0) rotate(720deg); opacity: 0.85; }
      }
      @keyframes bar-fill {
        0%   { transform: translateX(-101%); }
        50%  { transform: translateX(0); }
        100% { transform: translateX(101%); }
      }

      @media (prefers-reduced-motion: reduce) {
        #initial-loader *,
        #initial-loader *::before,
        #initial-loader *::after {
          animation: none !important;
        }
        #initial-loader .arc-bg,
        #initial-loader .arc-fg {
          stroke-dashoffset: 0 !important;
        }
        #initial-loader .name span {
          opacity: 1 !important;
          transform: none !important;
        }
      }

      html[data-admin-splash] #initial-loader {
        background: #faf8f5;
      }
      html[data-admin-splash] #initial-loader .orb,
      html[data-admin-splash] #initial-loader .confetti-field {
        display: none;
      }
      html[data-admin-splash] #initial-loader .mark::after {
        border-color: rgba(26, 26, 26, 0.18);
      }
      html[data-admin-splash] #initial-loader .mark .arc-bg {
        stroke: #ff7a4c;
      }
      html[data-admin-splash] #initial-loader .mark .arc-fg {
        stroke: #1a1a1a;
      }
      html[data-admin-splash] #initial-loader .name::after {
        content: "Admin Console";
        display: block;
        margin-top: 10px;
        font-family: "JetBrains Mono", ui-monospace, monospace;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: rgba(26, 26, 26, 0.55);
      }
      html[data-admin-splash] #initial-loader .tagline-track {
        display: none;
      }
      html[data-admin-splash] #initial-loader .tagline-box::before {
        content: "Preparing command center";
        display: flex;
        height: 22px;
        align-items: center;
        justify-content: center;
        font-family: "JetBrains Mono", ui-monospace, monospace;
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: rgba(26, 26, 26, 0.45);
      }
    </style>
  </head>
  <body>
    <script>
      // Skip the consumer-branded splash on portal/console shells — they have
      // their own matching skeletons rendered by React.
      (function () {
        try {
          var p = location.pathname;
          if (/^\/admin(\/|$)/.test(p)) {
            document.documentElement.setAttribute("data-admin-splash", "");
          } else if (/^\/(partner|corporate|advertise\/portal|business|concierge|portal)(\/|$)/.test(p)) {
            document.documentElement.setAttribute("data-no-splash", "");
          }
        } catch (_) {}
      })();
    </script>
    <style>
      html[data-no-splash] #initial-loader { display: none !important; }
    </style>
    <div id="root">
      <div id="initial-loader">

        <div class="orb orb-1" aria-hidden="true"></div>
        <div class="orb orb-2" aria-hidden="true"></div>
        <div class="orb orb-3" aria-hidden="true"></div>

        <div class="confetti-field" aria-hidden="true">
          <i style="left: 5%; --dx: 60px; background: #ff5a3c; animation-duration: 4.2s; animation-delay: 0s;"></i>
          <i style="left: 12%; --dx: -40px; background: #ff9a3c; animation-duration: 5.1s; animation-delay: 0.6s;"></i>
          <i style="left: 20%; --dx: 30px; background: #ffc24a; animation-duration: 3.8s; animation-delay: 1.2s;"></i>
          <i style="left: 28%; --dx: -50px; background: #e63d57; animation-duration: 4.6s; animation-delay: 0.3s;"></i>
          <i style="left: 36%; --dx: 70px; background: #ff7a4c; animation-duration: 5.3s; animation-delay: 1.5s;"></i>
          <i style="left: 44%; --dx: -30px; background: #ffc24a; animation-duration: 4s; animation-delay: 0.9s;"></i>
          <i style="left: 52%; --dx: 50px; background: #ff5a3c; animation-duration: 4.8s; animation-delay: 0.2s;"></i>
          <i style="left: 60%; --dx: -60px; background: #ff9a3c; animation-duration: 5.5s; animation-delay: 1.1s;"></i>
          <i style="left: 68%; --dx: 20px; background: #e63d57; animation-duration: 4.4s; animation-delay: 1.8s;"></i>
          <i style="left: 76%; --dx: -45px; background: #ff7a4c; animation-duration: 4.9s; animation-delay: 0.5s;"></i>
          <i style="left: 84%; --dx: 55px; background: #ffc24a; animation-duration: 5.2s; animation-delay: 1.4s;"></i>
          <i style="left: 92%; --dx: -25px; background: #ff5a3c; animation-duration: 4.1s; animation-delay: 0.8s;"></i>
        </div>

        <div class="stage">
          <div class="mark">
            <svg viewBox="0 0 100 100" aria-hidden="true">
              <circle class="arc-bg" cx="50" cy="50" r="38" stroke-dasharray="190 70" transform="rotate(-90 50 50)" />
              <circle class="arc-fg" cx="50" cy="50" r="38" stroke-dasharray="190 70" transform="rotate(-90 50 50)" />
            </svg>
          </div>

          <div class="name">
            <span style="animation-delay:0.3s">C</span><span style="animation-delay:0.38s">o</span><span style="animation-delay:0.46s">n</span><span style="animation-delay:0.54s">f</span><span style="animation-delay:0.62s">e</span><span style="animation-delay:0.70s">t</span><span style="animation-delay:0.78s">t</span><span style="animation-delay:0.86s">i</span>
          </div>

          <div class="tagline-box">
            <div class="tagline-track">
              <div class="tagline">Curating your night</div>
              <div class="tagline">Sorting the city</div>
              <div class="tagline">Loading venues</div>
              <div class="tagline">Finding the vibe</div>
              <div class="tagline">Curating your night</div>
            </div>
          </div>

          <div class="progress-track" aria-hidden="true">
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
