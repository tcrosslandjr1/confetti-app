<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Redirecting…</title>
  <script>
    // SPA deep-link rescue: Lovable's hosting serves this page for unknown
    // paths. We stash the original URL, bounce to "/", and the recovery
    // script inside index.html restores the path via history.replaceState
    // so TanStack Router picks up the correct route.
    sessionStorage.setItem(
      '__spa_redirect__',
      location.pathname + location.search + location.hash
    );
    location.replace('/');
  </script>
</head>
<body></body>
</html>
